
name: HTML CI and CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - '**.html'

  pull_request:
    branches:
      - main
    paths:
      - '**.html'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: CI - Build Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install HTML Validator
        run: npm install -g html-validate

      - name: Validate HTML
        run: html-validate index.html

      - name: Upload Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'

  deploy:
    name: CD - Deploy Website
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4

